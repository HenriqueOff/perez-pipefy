name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (tsc + eslint + jest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipelines
          POSTGRES_PASSWORD: pipelines
          POSTGRES_DB: pipelines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipelines"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run build --workspace backend
      - name: Lint
        run: npm run lint --workspace backend
      - name: Test
        # jest carrega backend/.env.test (DATABASE_URL -> localhost:5432/pipelines_test);
        # o serviço postgres acima usa exatamente esse usuário/senha e o globalSetup
        # cria e migra o banco pipelines_test.
        run: npm test --workspace backend

  frontend:
    name: frontend (eslint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace frontend
      - name: Build
        # o prebuild roda `tsc -b` antes do `vite build`
        run: npm run build --workspace frontend
